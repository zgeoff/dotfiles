# repo-sync delivers this file from zgeoff/tools
#
# Lints the pull request's title as a Conventional Commit, since a squash merge
# makes it the commit subject.
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    permissions:
      contents: read
    uses: zgeoff/tools/.github/workflows/pr-title-check.yml@6a5c45c02b3cd190fb4c66511da7dc9b056f4888 # main
