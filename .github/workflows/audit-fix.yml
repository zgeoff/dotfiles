# repo-sync delivers this file from zgeoff/tools
#
# Runs the shared audit-fix step, which turns a red `bun audit` on the default
# branch into a fix pull request, or into a pull request that records an ignore
# with a reason and an expiry. It runs daily, by hand, and after a PR or
# dependency-health run on main fails. A failed run on any other branch starts
# nothing, because the job audits only the default branch. A failed run of a
# pull request, or from another repository, starts nothing either, because a
# fork's branch can be named main. It needs Bun 1.4.0 or newer in .bun-version
# and the repo-sync App secrets.
name: Audit fix

on:
  workflow_run:
    workflows: [PR, pr, CI, Dependency Health, Dep Health]
    types: [completed]
    branches: [main]
  schedule:
    - cron: 30 5 * * *
  workflow_dispatch:

# One run at a time; a run that queues behind it replaces any older queued run.
concurrency:
  group: audit-fix
  cancel-in-progress: false

jobs:
  audit-fix:
    if: >-
      github.event_name != 'workflow_run' ||
      (contains(fromJSON('["push","schedule","workflow_dispatch"]'),
      github.event.workflow_run.event) && github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read
    uses: zgeoff/tools/.github/workflows/audit-fix.yml@e0acbfbb461b9b5d60e53e1c91ff8a46753e07fe # main
    secrets:
      REPO_SYNC_APP_CLIENT_ID: ${{ secrets.REPO_SYNC_APP_CLIENT_ID }}
      REPO_SYNC_APP_PRIVATE_KEY: ${{ secrets.REPO_SYNC_APP_PRIVATE_KEY }}
