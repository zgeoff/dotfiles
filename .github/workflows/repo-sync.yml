# Calls the repo-sync workflow in zgeoff/tools, which opens one pull request that
# carries every manifest entry whose files this repository is behind on.
#
# Two optional string inputs under `with:` change which entries run. `skip`
# takes the comma-separated names of the entries to leave alone. `include`
# takes the comma-separated names of the opt-in entries to sync, which reach
# this repository only when they are listed. A name in `include` that is not an
# opt-in entry fails the run.
#
# The `uses:` line pins a sync tag of zgeoff/tools, and a run syncs the files
# that tag holds. A push to main that changes this file, such as the merge of
# Renovate's bump to a newer tag, starts a run, so the new tag's files arrive
# without waiting for the weekly run. scripts/pin-tools-ref.sh in zgeoff/tools
# moves a repo to a tag by hand.
name: Repo sync

on:
  push:
    branches: [main]
    paths: [.github/workflows/repo-sync.yml]
  schedule:
    # Monday 06:00 UTC
    - cron: 0 6 * * 1
  workflow_dispatch:

# A newer run syncs every entry again, so it replaces an older run on the ref.
concurrency:
  group: repo-sync-caller-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    permissions:
      contents: read
    uses: zgeoff/tools/.github/workflows/repo-sync.yml@sync-v29
    with:
      skip: editorconfig, socket, skill-pr-evidence, memory-cap
    secrets:
      REPO_SYNC_APP_CLIENT_ID: ${{ secrets.REPO_SYNC_APP_CLIENT_ID }}
      REPO_SYNC_APP_PRIVATE_KEY: ${{ secrets.REPO_SYNC_APP_PRIVATE_KEY }}
