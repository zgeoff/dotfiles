# repo-sync delivers this file from zgeoff/tools
#
# Checks the pull request's description against the PR template, and ticks the
# chex box of its Checks section when the docs checks pass. The body check
# runs on each push and each edit. The tick runs on a push or a new pull
# request only, in this repo's own pull requests, and never for a bot.
name: PR body

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# An edit cancels only an older edit's run, and a push only an older push's run. An edit right
# after a push, such as the verify report landing, must not cancel the push's run, because only
# that run ticks the chex box.
concurrency:
  group:
    pr-body-${{ github.event.pull_request.number }}-${{ github.event.action == 'edited' && 'edit' ||
    'push' }}
  cancel-in-progress: true

jobs:
  pr-body:
    # The tick job edits the body.
    permissions:
      contents: read
      pull-requests: write
    uses: zgeoff/tools/.github/workflows/pr-body-check.yml@c2d388d14c2c0af2278eaf9dc16d996ef086ed50 # main
