[settings]
# install pipx-backend tools with uv
pipx.uvx = true
# take a repo's Rust from its rust-toolchain.toml, so the global stable never
# overrides a repo's pin through RUSTUP_TOOLCHAIN
idiomatic_version_file_enable_tools = ["rust"]

[tools]
go = "1.27.3"
node = "24.22.1"
python = "3.15.2"
ruby = "4.0.9"

# global CLI tools
"npm:agent-browser" = "latest"
"pipx:poetry" = "latest"
"pipx:shell-gpt" = "latest"
gitleaks = "8.30.1"
rust = "stable"
"cargo:tokei" = "15.0.0"
actionlint = "1.7.12"
